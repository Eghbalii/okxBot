# Docker's json-file driver keeps container logs forever unless told otherwise, and on a 25GB VPS
# that fills the disk: cmd/api alone reached 29MB, with ~49MB across all containers and no bound on
# further growth. Capped here rather than per-service so a new service cannot be added without it.
#
# This does not lose searchable history — Promtail ships these same files to Loki (CLAUDE.md §11.7),
# which has its own 14-day retention. The rotation only bounds the copy on local disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Every service restarts on failure. Without this a single transient error (a Kafka DNS
# blip, an OOM kill) is permanent downtime: cmd/paper-trader died on a Kafka lookup timeout
# and stayed dead, silently stopping all trading and RL reward collection. CLAUDE.md §11.2
# assumed this policy was already in place -- it was not.
x-restart: &default-restart unless-stopped

services:
  # redis is now only used by cmd/strategy-optimizer's disposable trial state (CLAUDE.md §16.3) —
  # the tick/candle/paper-order event bus moved to Kafka (below), CLAUDE.md §12.
  redis:
    logging: *default-logging
    restart: *default-restart
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Single-broker Kraft-mode Kafka (no separate Zookeeper) — the internal event bus (CLAUDE.md
  # §12): ticks/candles/paper-order events flow ingestor -> Kafka -> paper-trader/
  # strategy-optimizer/cmd/api's WebSocket bridge.
  kafka:
    logging: *default-logging
    restart: *default-restart
    image: apache/kafka:3.9.0
    # Kafka defaulted to a 1G heap on a 3.9GB host, leaving too little headroom for the rest
    # of the stack; that shortage is what let a single service's spike OOM the machine.
    # 512m is ample for this project's volume (a few topics, 24h retention, CLAUDE.md §12).
    mem_limit: 768m
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Bare-colon bind shorthand, not an explicit 0.0.0.0 host — the apache/kafka image's config
      # tool rejects "advertised.listeners cannot use the nonroutable meta-address 0.0.0.0" at
      # startup if KAFKA_LISTENERS spells out 0.0.0.0 explicitly here, even though only
      # KAFKA_ADVERTISED_LISTENERS (below) is what actually gets advertised.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Time-based retention is Kafka's equivalent of the old Redis Streams MAXLEN~100k cap — a
      # safety window so a consumer that falls behind (crash/restart) can catch up without losing
      # messages, not an archive. Lowered 24h -> 6h (2026-09-02): every consumer group here reads
      # near-real-time, so 6h of buffer is ample slack, and it cuts steady-state Kafka disk usage
      # roughly 4x — this was the single largest disk consumer on the box (CLAUDE.md's own
      # resource-scaling discussion). There's no per-topic override here, just the broker default.
      KAFKA_LOG_RETENTION_HOURS: 6
      # Retention can only delete a CLOSED segment, so the segment size is what actually bounds
      # disk on a high-volume topic. At the 1GB default, okx.tickers (~1.2M msgs/hour) held a full
      # closed 1GB segment plus a growing active one — 1.4GB for a topic nothing reads past the
      # last few minutes of, with 6h retention unable to reclaim any of it. 128MB segments rolled
      # hourly let retention work as intended (measured 2026-09-15: 2.3GB of /tmp/kafka-logs).
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_LOG_ROLL_HOURS: 1
      # The same closed-segment rule applies to COMPACTED topics: __consumer_offsets had reached
      # 332MB across its 50 partitions because the cleaner had literally never run (0 entries in
      # log-cleaner.log since the cluster was created 2026-09-02) — its segments never closed, so
      # there was never anything eligible to compact. With a 20MB segment and a 10m roll it
      # compacted 332MB -> 55MB on first pass, one partition reporting a 100% size reduction
      # (370,096 messages -> 9). min.cleanable.dirty.ratio is deliberately low: these partitions
      # are almost entirely superseded offset commits, so nearly every byte is reclaimable.
      KAFKA_OFFSETS_TOPIC_SEGMENT_BYTES: 20971520
      KAFKA_LOG_CLEANER_MIN_CLEANABLE_RATIO: 0.01
      # __consumer_offsets is compacted, not time-retained, and had grown to ~370MB across its
      # 50 partitions. Segment+roll bounds apply to it too via these broker-wide defaults.
      KAFKA_LOG_CLEANER_ENABLE: "true"
      # NOTE (2026-09-15): the kafka-data volume below is mounted but UNUSED — the apache/kafka
      # image defaults log.dirs to /tmp/kafka-logs, so topic data lives in the container's own
      # writable layer on the root filesystem. Deliberately NOT repointed: in KRaft mode the log
      # dir also holds __cluster_metadata and meta.properties, so moving it to the empty volume
      # needs a kafka-storage.sh format against the existing cluster id and discards every topic
      # and consumer offset. The segment bounds above solve the disk problem without that risk.
    ports:
      - "9094:9094" # host-reachable listener, for local dev tooling outside compose
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  timescaledb:
    logging: *default-logging
    restart: *default-restart
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: okxbot
      POSTGRES_PASSWORD: okxbot
      POSTGRES_DB: okxbot
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  rl-service:
    logging: *default-logging
    restart: *default-restart
    # SAC training spikes well above its ~330MB idle footprint (CLAUDE.md §15.1 measured
    # ~450MB and ~470% CPU during a gradient-heavy run). Capped so a training spike degrades
    # inference rather than OOM-killing the trading services alongside it.
    mem_limit: 1g
    build: ./rl-service
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      # CLAUDE.md §15.8: train.py --warm-start reads candles/paper_orders from the same Postgres
      # go-engine writes to; the serving container itself never queries Postgres (only /predict).
      POSTGRES_DSN: postgres://okxbot:okxbot@timescaledb:5432/okxbot
    volumes:
      - ./rl-service/configs:/app/configs
      - ./rl-service/models:/app/models
      - ./rl-service/data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb

  ingestor:
    logging: *default-logging
    restart: *default-restart
    build:
      context: ./go-engine
      dockerfile: Dockerfile.ingestor
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      KAFKA_BROKERS: kafka:9092
      METRICS_ADDR: ":9101"
      # Required since 2026-09-13: the instrument roster moved from config.yaml into Postgres
      # (migration 000031, §53), so this service now reads which instruments to subscribe to from the
      # database. It had no Postgres dependency before that and therefore no DSN — the same gap that
      # left cmd/trader silently failing to write its equity timeline for months (§27.7), caught here
      # within a minute because the ingestor cannot start at all without it.
      POSTGRES_DSN: postgres://okxbot:okxbot@timescaledb:5432/okxbot
    ports:
      - "9101:9101"
    volumes:
      - ./go-engine/configs:/app/configs
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_started

  # okx-gateway is the single process that holds real OKX credentials and rate-limits/prioritizes
  # REST calls across every other service (CLAUDE.md §27.1). Deployed here but NOT YET the
  # exclusive credential holder — cmd/trader and the other services still read OKX_API_KEY/etc
  # directly until each is migrated to call this gateway instead (§27.1's migration order: trader
  # first, verified against real OKX, then paper-trader/ingestor/strategy-tester/
  # strategy-optimizer independently). Until that migration lands this service runs unused.
  okx-gateway:
    logging: *default-logging
    restart: *default-restart
    build:
      context: ./go-engine
      dockerfile: Dockerfile.okx-gateway
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      GATEWAY_ADDR: "0.0.0.0:8094"
      METRICS_ADDR: ":9105"
      OKX_API_KEY: ${OKX_API_KEY}
      OKX_API_SECRET: ${OKX_API_SECRET}
      OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE}
      OKX_SIMULATED_TRADING: ${OKX_SIMULATED_TRADING:-1}
      # Needed since 2026-09-09: the gateway also runs OKX's private WebSocket (this is the only
      # process with credentials) and republishes the account's position/order pushes onto
      # okx.account-events for cmd/trader. Without this the client falls back to its own
      # localhost:9092 default, which inside this container is its OWN loopback, not kafka — the
      # exact mistake already made once for cmd/trader's own consumer (see its comment below).
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka
    ports:
      - "8094:8094"
      - "9105:9105"
    volumes:
      - ./go-engine/configs:/app/configs

  trader:
    logging: *default-logging
    # unless-stopped since 2026-09-09, replacing on-failure:5. The cap was protecting against a
    # crash loop from a missing/misconfigured okx-gateway at startup (CLAUDE.md §27.1), but it
    # counted the panel's own Restart button toward the same five retries — every Resume/Save &
    # Apply click is a process exit. Six clicks exhausted it and the trader stayed dead with two
    # real positions open on the exchange, both flagged for manual close and both still losing,
    # because nothing was alive to close them.
    #
    # The startup guards still exit(1) and Docker's default restart backoff already spaces a
    # genuine crash loop out rather than spinning on it, so the cap was never what protected
    # against that — it only ever capped legitimate restarts. handleRestart now exits 0, which
    # unless-stopped relaunches; see its own comment for why the two must be chosen together.
    restart: unless-stopped
    build:
      context: ./go-engine
      dockerfile: Dockerfile.trader
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      RL_SERVICE_URL: http://rl-service:8000
      # CLAUDE.md §27.1: cmd/trader migrated off rest.Client onto cmd/okx-gateway — it no longer
      # holds OKX_API_KEY/SECRET/PASSPHRASE/SIMULATED_TRADING at all (only the gateway does). Mode
      # (real vs demo) is derived from the gateway's own GET /health response, not a local env var.
      OKX_GATEWAY_URL: http://okx-gateway:8094
      # Found missing 2026-09-05 during the first real-trading activation: without this,
      # kafkastream.NewConsumer falls back to its own localhost:9092 default — inside this
      # container that's its OWN loopback, not the kafka container, so RealTrader received zero
      # ticks/candles and could never evaluate a signal. Same class of oversight as the
      # previously-missing POSTGRES_DSN on this same service (§27.7).
      KAFKA_BROKERS: kafka:9092
      # Postgres is OPTIONAL for cmd/trader (§15.7: used only for the equity-timeline chart, a
      # connection failure degrades to "no timeline recorded" rather than exiting) — but was
      # previously left unset here entirely, silently falling back to config's localhost default,
      # unreachable from inside the container. Found and fixed while verifying the gateway
      # migration on the real server (2026-09-01): every real/demo poll was logging a Postgres
      # connection-refused warning that a correctly-set DSN eliminates.
      POSTGRES_DSN: postgres://okxbot:okxbot@timescaledb:5432/okxbot
      # Restart-only HTTP surface (CLAUDE.md real-trading readiness plan, 2026-09-04) — mirrors
      # PAPER_TRADER_ADDR's pattern, next free app port at 8095 (8094 is okx-gateway).
      TRADER_ADDR: "0.0.0.0:8095"
    ports:
      - "8095:8095"
    volumes:
      - ./go-engine/configs:/app/configs
    # No redis/kafka dependency: cmd/trader's loop is REST-poll (via okx-gateway) + rl-service,
    # plus an optional Postgres connection for the equity timeline above. Redis was listed here
    # from before the event bus moved to Kafka (§12) and was never actually used by this service.
    depends_on:
      - rl-service
      - okx-gateway
      - timescaledb

  paper-trader:
    logging: *default-logging
    restart: *default-restart
    build:
      context: ./go-engine
      dockerfile: Dockerfile.paper-trader
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      KAFKA_BROKERS: kafka:9092
      POSTGRES_DSN: postgres://okxbot:okxbot@timescaledb:5432/okxbot
      METRICS_ADDR: ":9102"
      # Panel control-box HTTP surface (pause/stop, long/short toggle, active strategies/tokens/
      # timeframes) — cmd/paper-trader was headless before this; mirrors strategy-tester's own
      # TESTER_ADDR pattern (8092), next free app port at 8093.
      PAPER_TRADER_ADDR: "0.0.0.0:8093"
      # Without this, rlclient falls back to its http://localhost:8000 default (CLAUDE.md §15) —
      # inside this container that's its OWN loopback, not the rl-service container, so every
      # RL call (open decision, in-trade update, terminal reward report) fails with "connection
      # refused". Only surfaced once paper_trading.rl_sizing/rl_sltp_adjust were actually turned on
      # (§14's rollout order) — before that the model call path was never exercised in production.
      RL_SERVICE_URL: http://rl-service:8000
      # CLAUDE.md §27.1: cmd/paper-trader had NO OKX dependency from 2026-09-01 (when the
      # -backfill flag was removed) until 2026-09-06, when the funding-rate poller
      # (runFundingRatePoller) became its one gateway-routed call — a read-only, unauthenticated
      # public endpoint (GET /funding-rate-history), not a trading call.
      OKX_GATEWAY_URL: http://okx-gateway:8094
    ports:
      - "9102:9102"
      - "8093:8093"
    volumes:
      - ./go-engine/configs:/app/configs
    depends_on:
      kafka:
        condition: service_healthy
      rl-service:
        condition: service_started
      okx-gateway:
        condition: service_started
      timescaledb:
        condition: service_started

  optimizer-service:
    logging: *default-logging
    restart: *default-restart
    build: ./optimizer-service
    ports:
      - "8001:8001"

  # DELIBERATELY DISABLED (2026-09-04, explicit operator instruction) — profiles: [disabled] means
  # a plain "docker compose up -d" (with no service name and no --profile flag) never starts this,
  # even after a host reboot or a broad compose up. Do not remove the profiles line without asking
  # first. See CLAUDE.md for the reasoning (paired with strategy-tester, §21's own known-bug note).
  strategy-optimizer:
    profiles: ["disabled"]
    logging: *default-logging
    restart: *default-restart
    build:
      context: ./go-engine
      dockerfile: Dockerfile.strategy-optimizer
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379 # internal/optimizer.TrialStore only — disposable trial state, CLAUDE.md §16.3
      POSTGRES_DSN: postgres://okxbot:okxbot@timescaledb:5432/okxbot
      OPTIMIZER_SERVICE_URL: http://optimizer-service:8001
      OPTIMIZER_ADDR: "0.0.0.0:8091"
      METRICS_ADDR: ":9103"
      # CLAUDE.md §27.1: talks to OKX only through cmd/okx-gateway now (its only OKX call is
      # trial candle-window seeding via GetCandles) — no OKX credentials held here directly.
      OKX_GATEWAY_URL: http://okx-gateway:8094
    ports:
      - "8091:8091"
      - "9103:9103"
    volumes:
      - ./go-engine/configs:/app/configs
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      timescaledb:
        condition: service_started
      optimizer-service:
        condition: service_started
      okx-gateway:
        condition: service_started

  # Independent strategy-validation service (2026-08-30 request): a standalone paper-trading
  # copy that opens real virtual positions against live prices to judge strategy signal quality,
  # entirely apart from the RL agent and cmd/paper-trader (CLAUDE.md's tester package doc comment
  # has the full design). Separate storage (tester_orders/tester_strategy_versions, migration
  # 000010) so it can never collide with production paper-trading data.
  # DELIBERATELY DISABLED (2026-09-04, explicit operator instruction, reaffirming §21's own
  # known-bug note) — profiles: [disabled] means a plain "docker compose up -d" never starts this.
  # Do not remove the profiles line without asking first.
  strategy-tester:
    profiles: ["disabled"]
    logging: *default-logging
    restart: *default-restart
    build:
      context: ./go-engine
      dockerfile: Dockerfile.strategy-tester
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      KAFKA_BROKERS: kafka:9092
      POSTGRES_DSN: postgres://okxbot:okxbot@timescaledb:5432/okxbot
      TESTER_ADDR: "0.0.0.0:8092"
      METRICS_ADDR: ":9104"
      # Reuses the SAME optimizer-service sidecar deployment as strategy-optimizer for the
      # automatic per-kind optimization loop (2026-08-31, internal/tester/optimizer_loop.go) — safe
      # because Optuna studies are isolated per opaque study_id string (tester.StudyID's "tester:"
      # prefix can never collide with strategy-optimizer's own "{inst_id}:{kind}" convention).
      OPTIMIZER_SERVICE_URL: http://optimizer-service:8001
      # CLAUDE.md §27.1: talks to OKX only through cmd/okx-gateway now (its only OKX call is
      # seedWindow's read-only GetCandles) — no OKX credentials held here directly.
      OKX_GATEWAY_URL: http://okx-gateway:8094
    ports:
      - "8092:8092"
      - "9104:9104"
    volumes:
      - ./go-engine/configs:/app/configs
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_started
      optimizer-service:
        condition: service_started
      okx-gateway:
        condition: service_started

  api:
    logging: *default-logging
    restart: *default-restart
    build:
      context: ./go-engine
      dockerfile: Dockerfile.api
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      KAFKA_BROKERS: kafka:9092 # consumes okx.paper-order-events for the panel's WebSocket bridge, CLAUDE.md §11.4/§12
      POSTGRES_DSN: postgres://okxbot:okxbot@timescaledb:5432/okxbot
      RL_SERVICE_URL: http://rl-service:8000
      TESTER_SERVICE_URL: http://strategy-tester:8092
      PAPER_TRADER_SERVICE_URL: http://paper-trader:8093
      TRADER_SERVICE_URL: http://trader:8095
      # cmd/api calls the gateway for two things: amending a real position's resting SL/TP when an
      # operator edits it from the panel (CLAUDE.md §35), and the Manage Tokens modal's
      # affordability column. Without this the client falls back to config's own
      # http://localhost:8094 default, which inside this container is its OWN loopback rather than
      # the gateway — a manual SL/TP edit then failed with "connection refused" (2026-09-10), the
      # same class of mistake already documented for cmd/trader's KAFKA_BROKERS below.
      OKX_GATEWAY_URL: http://okx-gateway:8094
      API_ADDR: "0.0.0.0:8090" # container-internal bind; only reachable via the OpenVPN network in prod, see CLAUDE.md §11
      API_PROCESS_MANAGER: docker
      # Disk cleanup's confirm-per-file candidates (CLAUDE.md, 2026-09-20): a read-write mount of
      # the whole repo root, separate from the read-only ./go-engine/configs mount below. cmd/api
      # only ever touches paths matching its own hardcoded allowlist (internal/api/diskfiles.go) —
      # this mount grants filesystem ACCESS, the allowlist is what bounds what's actually reachable.
      HOST_ROOT_DIR: /host/repo
    ports:
      - "8090:8090"
    volumes:
      - ./go-engine/configs:/app/configs
      - /var/run/docker.sock:/var/run/docker.sock:ro # lets cmd/api call `docker inspect`/`docker logs` for RL model status, CLAUDE.md §11.2
      - .:/host/repo # see HOST_ROOT_DIR above
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_started
      rl-service:
        condition: service_started
      okx-gateway:
        condition: service_started

  panel:
    logging: *default-logging
    restart: *default-restart
    build: ./panel
    ports:
      - "8080:80" # bind to the OpenVPN-facing interface only in production, see CLAUDE.md §11
    depends_on:
      - api

  # Host-level CPU/RAM/disk (the panel's "resources" tab, CLAUDE.md §11.1, currently only embeds
  # a Grafana link — this is what that dashboard actually has to show). Prometheus's own
  # process_* metrics (used elsewhere on the dashboard) are per-service, not host-wide; node-
  # exporter is the standard way to get the underlying VM's numbers into Prometheus at all.
  node-exporter:
    logging: *default-logging
    restart: *default-restart
    image: prom/node-exporter:latest
    command:
      - "--path.rootfs=/host"
      # Excludes noisy/irrelevant pseudo-filesystems (overlay layers, tmpfs, container mounts)
      # from the disk-usage metrics so "free disk space" reads as the host's real root volume,
      # not dozens of Docker-internal mounts.
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"

  prometheus:
    logging: *default-logging
    restart: *default-restart
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - ingestor
      - paper-trader
      - node-exporter

  # Single-node log aggregation (CLAUDE.md §11.2/§11.6 revised): Loki indexes only labels
  # (service, level), not full text, which is what keeps this lightweight next to
  # Elasticsearch/ELK at this project's log volume. No object store — filesystem storage on the
  # loki-data volume is appropriate for a single VPS, not a multi-node deployment.
  loki:
    logging: *default-logging
    restart: *default-restart
    image: grafana/loki:latest
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  # Tails every container's Docker json-file log directly off disk (not live container discovery
  # — see promtail-config.yml's comment: discovery-based scraping can miss a container that
  # crashes fast, losing exactly the crash logs this exists to capture; live-verified against a
  # real crash while building this) and ships to Loki. Parses the Go services' slog logfmt output
  # (time=... level=... msg=...) so "level" becomes a queryable Loki label — this is what makes
  # "search/filter a service's errors separately" work with zero application code changes.
  promtail:
    logging: *default-logging
    restart: *default-restart
    image: grafana/promtail:latest
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    logging: *default-logging
    restart: *default-restart
    image: grafana/grafana:latest
    # Grafana ballooned to 1.68GB RSS under an internet vulnerability scan and triggered a
    # system-wide OOM kill that took the host down. The cap bounds the blast radius so the
    # trading services can never be the collateral of a monitoring-tier memory spike.
    # 768m, not 512m: measured idle RSS is ~440MB, so a 512m cap sits at ~87% before any
    # query load and would simply trade the host OOM for a Grafana crash loop.
    mem_limit: 768m
    environment:
      # Read from the environment; set GRAFANA_ADMIN_PASSWORD in .env. Was hardcoded to
      # "admin" while the port was reachable from the internet.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # Bound to 0.0.0.0 deliberately: VPN clients arrive on tun0 (10.8.0.1), so a
      # 127.0.0.1 bind would make the panel unreachable over the VPN, and binding tun0's
      # address directly would break Docker startup whenever it precedes OpenVPN. Access is
      # gated by the OKXBOT_LOCK/DOCKER-USER iptables rules instead (CLAUDE.md §11).
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  redis-data:
  kafka-data:
  timescale-data:
  prometheus-data:
  grafana-data:
  loki-data:
