services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: okxbot
      POSTGRES_PASSWORD: okxbot
      POSTGRES_DB: okxbot
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  rl-service:
    build: ./rl-service
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      # CLAUDE.md §15.8: train.py --warm-start reads candles/paper_orders from the same Postgres
      # go-engine writes to; the serving container itself never queries Postgres (only /predict).
      POSTGRES_DSN: postgres://okxbot:okxbot@timescaledb:5432/okxbot
    volumes:
      - ./rl-service/configs:/app/configs
      - ./rl-service/models:/app/models
      - ./rl-service/data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb

  ingestor:
    build:
      context: ./go-engine
      dockerfile: Dockerfile.ingestor
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      REDIS_ADDR: redis:6379
      METRICS_ADDR: ":9101"
    ports:
      - "9101:9101"
    volumes:
      - ./go-engine/configs:/app/configs
    depends_on:
      - redis

  trader:
    build:
      context: ./go-engine
      dockerfile: Dockerfile.trader
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      REDIS_ADDR: redis:6379
      RL_SERVICE_URL: http://rl-service:8000
      OKX_API_KEY: ${OKX_API_KEY}
      OKX_API_SECRET: ${OKX_API_SECRET}
      OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE}
      OKX_SIMULATED_TRADING: ${OKX_SIMULATED_TRADING:-1}
    volumes:
      - ./go-engine/configs:/app/configs
    depends_on:
      - redis
      - rl-service

  paper-trader:
    build:
      context: ./go-engine
      dockerfile: Dockerfile.paper-trader
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://okxbot:okxbot@timescaledb:5432/okxbot
      METRICS_ADDR: ":9102"
      OKX_API_KEY: ${OKX_API_KEY}
      OKX_API_SECRET: ${OKX_API_SECRET}
      OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE}
      OKX_SIMULATED_TRADING: ${OKX_SIMULATED_TRADING:-1}
    ports:
      - "9102:9102"
    volumes:
      - ./go-engine/configs:/app/configs
    depends_on:
      - redis
      - timescaledb

  optimizer-service:
    build: ./optimizer-service
    ports:
      - "8001:8001"

  strategy-optimizer:
    build:
      context: ./go-engine
      dockerfile: Dockerfile.strategy-optimizer
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://okxbot:okxbot@timescaledb:5432/okxbot
      OPTIMIZER_SERVICE_URL: http://optimizer-service:8001
      OPTIMIZER_ADDR: "0.0.0.0:8091"
      METRICS_ADDR: ":9103"
    ports:
      - "8091:8091"
      - "9103:9103"
    volumes:
      - ./go-engine/configs:/app/configs
    depends_on:
      - redis
      - timescaledb
      - optimizer-service

  api:
    build:
      context: ./go-engine
      dockerfile: Dockerfile.api
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      POSTGRES_DSN: postgres://okxbot:okxbot@timescaledb:5432/okxbot
      RL_SERVICE_URL: http://rl-service:8000
      API_ADDR: "0.0.0.0:8090" # container-internal bind; only reachable via the OpenVPN network in prod, see CLAUDE.md §11
      API_PROCESS_MANAGER: docker
    ports:
      - "8090:8090"
    volumes:
      - ./go-engine/configs:/app/configs
      - /var/run/docker.sock:/var/run/docker.sock:ro # lets cmd/api call `docker inspect`/`docker logs` for RL model status, CLAUDE.md §11.2
    depends_on:
      - timescaledb
      - rl-service

  panel:
    build: ./panel
    ports:
      - "8080:80" # bind to the OpenVPN-facing interface only in production, see CLAUDE.md §11
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - ingestor
      - paper-trader

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis-data:
  timescale-data:
  prometheus-data:
  grafana-data:
