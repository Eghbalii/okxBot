server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: let react-router handle unknown paths client-side.
    location / {
        try_files $uri /index.html;
    }

    # index.html must NEVER be cached (2026-09-11). Vite fingerprints every asset
    # (index-<hash>.js), so index.html is the only file that says which build to load — and it was
    # being served with no cache headers at all, leaving the decision to the browser's heuristics.
    # A browser holding yesterday's index.html silently keeps running yesterday's app, which
    # presented as "the chart doesn't load" while the server was serving a perfectly good build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # The hashed assets are the opposite case: their name changes whenever their content does, so
    # they are safe to cache indefinitely and a new build simply requests new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Same-origin proxy to cmd/api — the panel and its API share one origin, matching the
    # OpenVPN-only access model (CLAUDE.md §11): nothing here is meant to be reachable from the
    # public internet, this container is only exposed on the VPN-facing network.
    location /api/ {
        proxy_pass http://api:8090/api/;
        proxy_set_header Host $host;
    }

    # GET /api/ws (CLAUDE.md §11.4/§12): the real-time WebSocket bridge. A dedicated location so
    # the upgrade headers only apply to this long-lived connection, plus longer read/send timeouts
    # than nginx's defaults (the socket sits idle between paper-order events, not constantly
    # active like a normal request).
    location /api/ws {
        proxy_pass http://api:8090/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
