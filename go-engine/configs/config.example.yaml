# kafka.brokers is set via KAFKA_BROKERS only (comma-separated, e.g. "kafka:9092"), same pattern
# as postgres/redis below — see CLAUDE.md §12 for why Kafka is the internal event bus.

okx:
  rest_base_url: "https://www.okx.com"
  public_ws_url: "wss://ws.okx.com:8443/ws/v5/public"
  private_ws_url: "wss://ws.okx.com:8443/ws/v5/private"

trading:
  inst_ids:
    - "BTC-USDT-SWAP"
  poll_interval_sec: 5
  td_mode: "cross"        # "cross" or "isolated"
  pos_mode: "net"         # "net" or "long_short" (hedge mode)
  min_order_usd: 10       # skip rebalancing orders smaller than this
  # CLAUDE.md §15.6: the paper -> demo -> real progression. cmd/trader REFUSES to start against
  # real (non-demo) credentials unless this is explicitly true — going live should require saying
  # so, not just forgetting to set OKX_SIMULATED_TRADING. Trading mode itself is derived from that
  # env var (simulated => demo, otherwise real), so mode can never disagree with the keys in use.
  allow_real_money: false

# The always-on data collector (cmd/ingestor): a broad, stable set of timeframes it publishes to
# Redis 24/7, independent of what any given paper-trading/strategy test run actually evaluates.
# CASING IS NOT COSMETIC: OKX's channel names are case-sensitive (capital H/D, lowercase m), and
# the ingestor subscribes to "candle"+bar literally — "1h" would subscribe to a channel that pushes
# nothing, so that timeframe silently produces no candles while the pipeline looks healthy.
# config.ValidateBarNames rejects a mis-cased bar at startup rather than letting that happen.
ingestion:
  bars:
    - "5m"
    - "15m"
    - "1H"
    # Collected for higher-timeframe CONTEXT only — a strategy assigned to 5m can consult these via
    # strategy.MultiTimeframeStrategy for trend confirmation (CLAUDE.md §9). Nothing decides on them.
    - "4H"
    - "1D"

paper_trading:
  # Low notional, high fixed leverage (2026-08-31, explicit operator decision): the deployed
  # service targets small-account/high-leverage operation, so paper trading should exercise that
  # combination when rl_sizing is off (defaultPaperLeverage in papertrade.go carries the matching
  # value — 10x as of 2026-09-01, capped by OKX's real-account leverage limit). Also each order's
  # own size/leverage line, unaffected by this default.
  #
  # 4 = the real $40 account (account.initial_usd) divided evenly across the ~10 configured tokens,
  # so one open position per token at a time fits the shared account (2026-09-01, explicit operator
  # decision) — a deliberate, simple placeholder rule for the period before rl_sizing is trusted
  # enough to turn on and let the model decide sizing itself (§14 roadmap item 5); revisit this
  # value once that happens, don't tune it further as a fixed rule before then.
  notional_usd: 4
  max_open_orders: 3
  # The timeframes strategies actually DECIDE on — the RL model's training cadence (CLAUDE.md §9).
  # Must be a subset of ingestion.bars above (validated at startup: a bar the ingestor isn't
  # publishing has no Kafka topic to consume from).
  # A strategy assigned here may still read any bar in ingestion.bars above for context, so adding
  # a longer timeframe for confirmation does not require adding it here.
  bars:
    - "5m"
    - "15m"
    - "1H"
  candle_limit: 100
  # Which timeframe's signals/price-context feed a TICK-driven RL SL/TP-adjust decision
  # (CLAUDE.md §15.9) — a tick belongs to no single bar, so it's chosen rather than inferred.
  # Empty defaults to the shortest bar above, the freshest read of what price is doing right now.
  # Must be one of paper_trading.bars.
  rl_decision_bar: "5m"
  # CLAUDE.md §15.4: enables the RL-driven in-trade SL/TP adjustment pass — calls rl_service's
  # /predict on the live tick stream (throttled to a couple of seconds, per §15.9's freshness fix)
  # for each open baseline order, forking a linked copy if it proposes a nonzero adjustment. Off by
  # default — requires rl_service reachable at rl_service.url.
  rl_sltp_adjust: false
  # CLAUDE.md §15.4: lets the RL agent size each new order (notional + leverage from its
  # target_exposure/leverage_frac) instead of opening every order at notional_usd and 1x. Off by
  # default, and independent of rl_sltp_adjust above. Worth knowing: while this is off, the
  # paper_orders log records no leverage or exposure variance at all, so §15.8's continued-live-
  # learning phase has no sizing signal to learn from. Leverage is capped by risk.max_leverage.
  rl_sizing: false

  # --- Signal-lifecycle conductor (CLAUDE.md §15.12) ---
  # The conductor decides WHICH lifecycle question to ask the model (buy/sell, update, closed_*)
  # and at what cadence. Without it nothing ever delivers a reward: rl_service's learner pairs each
  # decision with the realized PnL that arrives on the terminal close call, so a model with no
  # terminal calls is asked questions but never told how any answer turned out.
  #
  # Update cadence: an `update` call fires when unrealized PnL has moved at least this fraction
  # since the last update for that order, OR the interval below elapses, OR a strategy fires
  # (never filtered — a real opinion always reaches the model immediately). PnL-delta rather than a
  # fixed tick keeps the cadence self-adapting: near-silent while a position ranges, dense while it
  # actually moves, and roughly 10 meaningful steps per trade instead of thousands of
  # near-identical ones, which is what makes credit assignment tractable at all.
  rl_update_pnl_threshold_pct: 0.01
  # A position grinding sideways must still be observed: funding accrues, setups decay, and "time
  # passed" is itself information the model should receive.
  rl_update_max_interval: 15m
  # Lets the model close a position before either level is touched, recorded as
  # close_reason='rl_early'. Off by default: it is the one lifecycle action that destroys the
  # counterfactual — an early-closed trade can never show what it would have done — so enable it
  # only once the SL/TP-adjust behavior is trusted.
  rl_early_close: false
  # Where the model may PLACE stops and targets on an open. Distinct from the ratchet, which
  # governs how levels may MOVE afterward and says nothing about the initial placement. Early in
  # training the policy is effectively random: a stop 0.001% from entry stops out on noise, one 40%
  # away turns a bounded loss into an account event, and a target nearer than the stop is
  # negative-expectancy by construction no matter how good the entry. Fractions, not percentages;
  # 0 disables the respective clamp.
  rl_clamps:
    min_sl_dist_pct: 0.005
    max_sl_dist_pct: 0.05
    # Caps the REALIZED loss a stop can produce once leverage is applied — 0.15 = never more than
    # 15% of margin, at any leverage (2026-08-31 request). Distinct from max_sl_dist_pct above,
    # which only bounds the raw price distance and knows nothing about leverage: at 20x, a stop
    # placed at max_sl_dist_pct alone would realize a 100% loss. Defaults to 0.15 even if left
    # unset here (internal/config.Load) — unlike the other rl_clamps fields, this one is not
    # opt-in-only-if-configured. No equivalent cap exists for take-profit; profit is never limited.
    max_loss_pct: 0.15
    # Minimum reward:risk. A too-near target is widened to satisfy it rather than the trade being
    # rejected, since the entry itself may still be sound.
    min_tp_sl_ratio: 1.5
  # Force-closes any position open longer than this, close_reason='timeout' (CLAUDE.md §15.14).
  # Housekeeping, not an RL decision -- fires unconditionally, independent of the RL flags above.
  rl_max_open_duration: 6h

# CLAUDE.md §15.6 (revised 2026-08-28): ONE shared capital pool every token trades against,
# replacing the earlier fixed per-token sub-budgets. How much of it goes into any single position is
# the RL agent's decision (target_exposure), bounded by the two caps below rather than by splitting
# the account into per-token buckets up front. Applies to all three modes, hence the top-level
# section rather than nesting under paper_trading.
account:
  # Lowered 100 -> 40 (2026-09-01, real-money wiring): the real account this service will trade
  # against is funded with $40. Shared across all three modes (paper/demo/real) by explicit
  # operator decision — paper training moves to the same $40 base rather than keeping a separate,
  # larger paper balance, so paper-trading's own per-position sizing stays representative of what
  # the real account can actually do. Starting balance, and what a drained paper/demo account
  # resets back to. Real mode never auto-resets — running out there is a stop condition for a
  # human (§15.7).
  initial_usd: 40
  # Hard Go-side caps on the agent's sizing proposal, as FRACTIONS (0.25 = 25%), never percentages.
  # The model is never the safety boundary (§5, §15.4): at 100x leverage a single uncapped position
  # is an account-ending event, and the risk manager only guards the live path, not paper.
  max_position_pct: 0.25
  # The per-position cap alone would still allow four simultaneous 25% positions committing the
  # whole account, so total open exposure is bounded independently.
  max_total_exposure_pct: 0.60

risk:
  # Lowered 100 -> 10 (2026-09-01, explicit operator decision): OKX rejects orders above 10x
  # leverage on the real account this service is meant to eventually trade against, so the RL
  # agent's sizing ceiling (target_exposure/leverage_frac maps onto [1x, max_leverage]) and the
  # live risk manager's hard clamp (risk.Manager.Approve) must both stay within what OKX will
  # actually accept — a higher config value here would just get silently rejected order-by-order on
  # the real account, which is worse than training/validating against the real ceiling from the
  # start. Supersedes §15.4's original 10x-100x framing.
  max_leverage: 10
  max_position_notional_usd: 1000
  max_daily_drawdown_pct: 5
  # Raised 2 -> 5 (2026-09-01, real-money wiring): with max_leverage now capped at 10x (OKX's real
  # account limit), the conservative 100/leverage distance-to-liquidation estimate is always ~10%,
  # so a 5% floor never actually blocks a real order at this leverage — it exists purely as a final
  # backstop against total-margin liquidation, independent of and behind the 15% SL cap
  # (conductor.Clamps.MaxLossPct) that should always close a position long before this point is
  # ever reached. Choosing the safer (larger) margin per explicit operator instruction, same
  # "don't trust one layer alone" reasoning as the SL-cap incident. Was 2 when max_leverage was 100
  # (a value chosen specifically to keep near-100x leverage reachable, which no longer applies).
  min_liquidation_buffer_pct: 5

# cmd/api: dashboard/reporting backend (CLAUDE.md §11). No auth in v1 — bind addr to a private
# interface reachable only over the OpenVPN tunnel, never 0.0.0.0 on a public host.
api:
  addr: "127.0.0.1:8090"
  grafana_url: "http://localhost:3000"
  process_manager: "docker" # "systemd" or "docker" — how cmd/api queries RL model liveness/uptime/logs
  units:                    # container/unit names to report on for the RL model status panel
    - "okxbot-rl-service-1"

# cmd/strategy-optimizer (CLAUDE.md §16/§16.7): standing service that time-boxes real-market-data
# trial runs of candidate strategy parameter sets and, on a schedule, persists the best-performing
# candidate as a new sub-strategy. optimizer.url (the Python/Optuna sidecar) is set from
# OPTIMIZER_SERVICE_URL only, same pattern as rl_service.url — not set here.
optimizer:
  addr: "127.0.0.1:8091"
  schedule_interval: "24h"  # how often the built-in scheduler fires one pass per target
  run_duration: "4h"        # each run's wall-clock time box
  min_trades_per_candidate: 15  # a candidate below this trade count at run end is not scoreable
  min_improvement_pct: 5    # winning candidate must beat the current baseline's win rate by this many pp
  min_win_rate_pct_floor: 50 # win-rate floor used instead, when no clean baseline exists yet
  bar: "15m"                 # candle timeframe every run evaluates candidates against
  candle_window: 100
  # Explicit (inst_id, kind) pairs the scheduler optimizes on schedule_interval. Leave empty to
  # fall back to default_kinds x trading.inst_ids instead.
  targets: []
  default_kinds:
    - "rsi_sma"
  # Caps a trial's SL distance from entry (2026-08-31 request, CLAUDE.md §19.2) — trials are
  # unleveraged, so this is a direct price-distance cap. Defaults to 0.15 even if left unset.
  max_loss_pct: 0.15

# cmd/strategy-tester (2026-08-30 request): independent paper-trading copy for validating raw
# strategy signal quality, entirely apart from the RL agent and cmd/paper-trader. Every registered
# strategy.Factories kind trades every configured instrument at one fixed timeframe, one open
# position per instrument, fixed size/leverage — no RL sizing, no in-trade SL/TP update mechanic.
# Storage is separate (tester_orders/tester_strategy_versions, migration 000010).
tester:
  bar: "5m"           # fixed at the timeframe that concentrates signals/fills in practice
  inst_ids: []        # empty = same roster as trading.inst_ids (the operator's own instruction)
  notional_usd: 10
  leverage: 10
  candle_window: 300
  # Force-closes a position open longer than this, close_reason='timeout' (2026-08-30 request).
  # This service has no in-trade update mechanic, so unlike production a position can otherwise
  # sit open forever if price never reaches either level.
  max_open_duration: 6h

  # Automatic per-kind optimization loop (2026-08-31 request): the service itself proposes new
  # parameter candidates via the SAME Optuna sidecar production's cmd/strategy-optimizer uses
  # (OPTIMIZER_SERVICE_URL, safe because studies are isolated per opaque study_id string — see
  # internal/tester/optimizer_loop.go), judges each candidate by win rate AND realized PnL together
  # once it accumulates internal/tester.MinTradesToScore (30) trades, and always builds the next
  # candidate from whichever version scores best across the kind's ENTIRE history (origin
  # included) — never just the most recent one. No version is ever deleted automatically; only a
  # manual delete from the panel removes one. Entirely independent of production's strategies/
  # strategy_assignments tables and its own optimizer's studies.
  optimize:
    check_interval: 1h   # how often the loop checks every kind for a judgeable/proposable candidate

  # Caps a strategy's own SL at the realized-loss level, same reasoning/default as
  # paper_trading.rl_clamps.max_loss_pct above (2026-08-31 request) — this service has no
  # EnsureStop-style fallback (a signal with no stop is skipped outright, CLAUDE.md §16.9), but an
  # SL that IS set must still respect the cap. min_sl_dist_pct/max_sl_dist_pct/min_tp_sl_ratio are
  # unused today (only max_loss_pct is wired into tester.BuildOrder) — present so this struct's
  # shape matches paper_trading.rl_clamps.
  rl_clamps:
    max_loss_pct: 0.15
