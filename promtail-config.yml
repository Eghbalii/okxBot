server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker service discovery: auto-attaches to every container's stdout/stderr on this host, no
  # per-service config needed as new cmd/* services are added (CLAUDE.md §12's "code against the
  # interface, transport stays swappable" instinct applied to logging too — this is transport-
  # agnostic w.r.t. what's actually running).
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Container name (e.g. "/okxbot-paper-trader-1") -> a clean "service" label
      # ("paper-trader") — strips the leading slash and the compose project prefix/instance
      # suffix, matching this project's cmd/* naming.
      - source_labels: [__meta_docker_container_name]
        regex: "/okxbot-(.*)-[0-9]+"
        target_label: service
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      # All go-engine services use slog.NewTextHandler (logfmt output: time=... level=... msg=...
      # key=value), so this single logfmt stage works across every Go service uniformly. Promotes
      # "level" to a real Loki label so {service="paper-trader", level="ERROR"} is queryable
      # directly, which is the actual "save errors separately" requirement — no application code
      # changes needed since slog already emits structured output.
      - logfmt:
          mapping:
            level: level
      - labels:
          level:
      # rl-service/optimizer-service (Python/uvicorn) and timescaledb/redis/kafka don't emit
      # logfmt — the logfmt stage above is a no-op (not an error) on non-matching lines, so their
      # raw log lines still land in Loki under {service=...}, just without a parsed "level" label.
      # Good enough for "search all logs"; only the Go services get level-based filtering for now.
