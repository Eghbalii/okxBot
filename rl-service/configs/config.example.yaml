data:
  candles_csv: "data/BTC-USDT-SWAP_1H.csv"

env:
  window_size: 32
  # CLAUDE.md §15.4: matches go-engine's risk.max_leverage ceiling.
  max_leverage: 100.0
  max_position_notional_usd: 1000.0
  taker_fee_rate: 0.0005
  funding_rate_per_8h: 0.0001
  initial_equity_usd: 10000.0
  liquidation_maintenance_margin_pct: 0.5

train:
  algo: "PPO"
  total_timesteps: 500000
  model_out: "models/ppo_okx_futures.zip"

# CLAUDE.md §15.8: warm-start replay training (`python -m rl_service.train --warm-start`) —
# initialization only against real historical market data already in Postgres, not the deployed
# model's actual training path (that's live paper-trading). Requires POSTGRES_DSN reachable.
warm_start:
  inst_ids:
    - "BTC-USDT-SWAP"
  # Single-bar by design — see WarmStartConfig.bar in rl_service/config.py for why interleaving
  # timeframes in one replay sequence would make the reward signal inconsistent across steps.
  # 15m: the middle of the deployed agent's 5m/15m/1H decision timeframes.
  bar: "15m"
  total_timesteps: 50000
  model_out: "models/sac_global.zip"
  initial_equity_usd: 10.0 # CLAUDE.md §15.6: matches the real per-token paper budget

serve:
  model_path: "models/sac_global.zip"
  # CLAUDE.md §15.11: keep learning from live outcomes instead of serving frozen weights. Terminal
  # (closed_*) calls deliver realized PnL as reward and trigger a gradient step.
  # OFF by default, and it MUST stay off for real money — a bad update would otherwise reach live
  # trading with no review gate. Turn it on for paper mode, where fast iteration is the point.
  learning_enabled: false
  buffer_size: 100000        # ~79 MB at this observation width; SB3's 1M default is Atari-sized
  learning_starts: 100       # no gradient steps until the buffer has this much to learn from
  gradient_steps: 4          # per closed trade; off-policy reuses each experience many times
  snapshot_every: 25         # closed trades between snapshots (weights AND buffer, never just one)
  buffer_path: "models/sac_global_buffer.pkl"
  # Overrides the learning_rate baked into the checkpoint at startup (SAC.load's own kwarg).
  # 0.0003 is SAC's/this project's original default; raised 5x here on 2026-09-07 after the model
  # had accumulated 62k gradient updates against only ~4.4k replay-buffer experiences with still-
  # negative 24h PnL. Watch the action distribution for collapse (e.g. all-skip) before raising more.
  learning_rate: 0.0015
  host: "0.0.0.0"
  port: 8000
