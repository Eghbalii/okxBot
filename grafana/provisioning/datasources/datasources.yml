# Auto-provisions both data sources on Grafana startup (CLAUDE.md §11.1/§11.6) — no manual
# "Add data source" clicking needed after a fresh `docker compose up`.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
