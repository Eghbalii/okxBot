# Auto-provisions both data sources on Grafana startup (CLAUDE.md §11.1/§11.6) — no manual
# "Add data source" clicking needed after a fresh `docker compose up`.
apiVersion: 1

datasources:
  # Fixed uids (not left to Grafana's auto-generated default) so dashboard JSON files
  # (grafana/provisioning/dashboards/) can reference these datasources by a stable id that
  # survives a fresh `docker compose up` — an auto-generated uid differs per instance, which
  # would silently break every panel's datasource reference on a new deploy.
  - name: Prometheus
    uid: okxbot-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    uid: okxbot-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
